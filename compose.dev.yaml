services:
  daymark-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "127.0.0.1:${DAYMARK_DEV_PORT:-5174}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    init: true
    restart: unless-stopped
